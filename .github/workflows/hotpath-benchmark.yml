name: hotpath benchmark

# Runs the Criterion benchmarks listed in hotpath/run-benchmarks.sh with hotpath profiling, natively
# and under Callgrind, and sends the merged reports to hotpath.rs, which compares each pull request
# with `main` and comments on regressions. See https://hotpath.rs/ci_integration.
#
# Pushes to `main` upload the baseline directly. Pull requests (including forks, which get no OIDC
# token) only write the reports to an artifact; hotpath-relay.yml uploads it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  upload:
    name: benchmark (push)
    if: github.event_name == 'push'
    # Instruction counts depend on the Valgrind build, the Rust toolchain and the OS, so the
    # image, the package and the toolchain are pinned. Bump them in a dedicated pull request.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # the upload authenticates with the job's OIDC token
    env:
      # rust-toolchain.toml selects `stable`; pin the exact version for comparable counts.
      RUSTUP_TOOLCHAIN: "1.100.0"
      HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.100.0,profile=hotpath,valgrind=3.26.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Run benchmarks and upload the merged reports
        run: hotpath/run-benchmarks.sh "$RUNNER_TEMP/hotpath" --upload

  report:
    name: benchmark (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Runs the pull request's code: no OIDC token and no secrets.
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
      HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.100.0,profile=hotpath,valgrind=3.26.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Run benchmarks and write the merged reports
        run: hotpath/run-benchmarks.sh "$GITHUB_WORKSPACE/hotpath-reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hotpath-report
          path: hotpath-reports/*.json
          retention-days: 1
          if-no-files-found: error
